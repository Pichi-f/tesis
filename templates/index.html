<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Cifra Negra - Visualización Geoespacial
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .contenedor {
            display: flex;
            height: 100vh;
        }

        .panel {
            width: 280px;
            background-color: white;
            padding: 24px;
            border-right: 1px solid #dddddd;
            overflow-y: auto;
        }

        .titulo {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitulo {
            margin-top: 0;
            color: #666666;
            font-size: 14px;
        }

        .seccion {
            margin-top: 28px;
        }

        .seccion h3 {
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .opcion {
            display: block;
            margin-bottom: 10px;
        }

        .campo-fecha {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }

        .boton {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #168aad;
            color: white;
            font-weight: bold;
        }

        .boton:hover {
            background-color: #126d89;
        }

        .estadistica {
            margin-top: 25px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 6px;
        }

        .estadistica-numero {
            font-size: 30px;
            font-weight: bold;
        }

        .estadistica-texto {
            color: #666666;
            font-size: 13px;
        }

        .mapa {
            flex: 1;
            height: 100vh;
        }

        .mapa iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .detalle-estadisticas {
            margin-top: 15px;
            font-size: 14px;
        }

        .detalle-estadisticas p {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }

        .estadistica hr {
            margin-top: 15px;
            border: none;
            border-top: 1px solid #dddddd;
        }

        .boton-secundario {
            margin-top: 10px;
            background-color: #6c757d;
        }

        .boton-secundario:hover {
            background-color: #565e64;
        }

        .leyenda-calor {
            margin-top: 10px;
        }

        .barra-calor {
            height: 14px;
            border-radius: 7px;

            background: linear-gradient(to right,
                    blue,
                    cyan,
                    lime,
                    yellow,
                    red);
        }

        .etiquetas-calor {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            color: #666666;
            font-size: 11px;
        }

        .titulo-estadistica {
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>

</head>


<body>

    <div class="contenedor">

        <aside class="panel">

            <h1 class="titulo">
                Cifra Negra
            </h1>

            <p class="subtitulo">
                Visor de incidentes
            </p>


            <form id="formulario-filtros">

                <div class="seccion">

                    <h3>
                        Categorías
                    </h3>

                    <label class="opcion">
                        <input type="checkbox" name="categoria" value="robo" checked>
                        Robo
                    </label>

                    <label class="opcion">
                        <input type="checkbox" name="categoria" value="extorsion" checked>
                        Extorsión
                    </label>

                    <label class="opcion">
                        <input type="checkbox" name="categoria" value="agresion" checked>
                        Agresión
                    </label>

                    <label class="opcion">
                        <input type="checkbox" name="categoria" value="otro" checked>
                        Otro
                    </label>

                    <hr>

                    <div class="titulo-estadistica">
                        Precisión geográfica
                    </div>

                    <div class="detalle-estadisticas">

                        <p>
                            Alta:
                            <strong id="precision-alta">
                                0
                            </strong>
                        </p>

                        <p>
                            Media:
                            <strong id="precision-media">
                                0
                            </strong>
                        </p>

                        <p>
                            Baja:
                            <strong id="precision-baja">
                                0
                            </strong>
                        </p>

                    </div>

                </div>


                <div class="seccion">

                    <h3>
                        Rango de fechas
                    </h3>

                    <label>
                        Desde
                    </label>

                    <input class="campo-fecha" type="date" id="fecha-desde">

                    <label>
                        Hasta
                    </label>

                    <input class="campo-fecha" type="date" id="fecha-hasta">

                    <button class="boton" type="submit">
                        Aplicar filtros
                    </button>

                    <button class="boton boton-secundario" type="button" id="limpiar-filtros">
                        Limpiar filtros
                    </button>

                </div>

            </form>


            <div class="estadistica">

                <div class="estadistica-numero" id="total-indicios">
                    {{ total_indicios }}
                </div>

                <div class="estadistica-texto">
                    Indicios mostrados
                </div>

                <hr>

                <div class="detalle-estadisticas">

                    <p>
                        Robo:
                        <strong id="cantidad-robo">
                            0
                        </strong>
                    </p>

                    <p>
                        Extorsión:
                        <strong id="cantidad-extorsion">
                            0
                        </strong>
                    </p>

                    <p>
                        Agresión:
                        <strong id="cantidad-agresion">
                            0
                        </strong>
                    </p>

                    <p>
                        Otro:
                        <strong id="cantidad-otro">
                            0
                        </strong>
                    </p>

                </div>

            </div>

            <div class="seccion">

                <h3>
                    Intensidad de incidentes
                </h3>

                <div class="leyenda-calor">

                    <div class="barra-calor"></div>

                    <div class="etiquetas-calor">

                        <span>
                            Baja
                        </span>

                        <span>
                            Media
                        </span>

                        <span>
                            Alta
                        </span>

                    </div>

                </div>

            </div>

        </aside>


        <main class="mapa">

            <iframe id="mapa" src="/mapa"></iframe>

        </main>

    </div>


    <script>

        const formulario = document.getElementById(
            "formulario-filtros"
        );

        const mapa = document.getElementById(
            "mapa"
        );

        const botonLimpiar = document.getElementById(
            "limpiar-filtros"
        );

        botonLimpiar.addEventListener(
            "click",
            function () {

                const categorias =
                    document.querySelectorAll(
                        'input[name="categoria"]'
                    );

                categorias.forEach(
                    function (categoria) {

                        categoria.checked = true;

                    }
                );


                document.getElementById(
                    "fecha-desde"
                ).value = "";

                document.getElementById(
                    "fecha-hasta"
                ).value = "";


                mapa.src = "/mapa";


                actualizarEstadisticas(
                    new URLSearchParams()
                );

            }
        );

        formulario.addEventListener(
            "submit",
            function (evento) {

                evento.preventDefault();

                const parametros = new URLSearchParams();

                const categorias =
                    document.querySelectorAll(
                        'input[name="categoria"]:checked'
                    );

                categorias.forEach(
                    function (categoria) {

                        parametros.append(
                            "categoria",
                            categoria.value
                        );

                    }
                );


                const desde =
                    document.getElementById(
                        "fecha-desde"
                    ).value;

                const hasta =
                    document.getElementById(
                        "fecha-hasta"
                    ).value;

                if (
                    desde
                    && hasta
                    && desde > hasta
                ) {

                    alert(
                        "La fecha inicial no puede ser "
                        + "posterior a la fecha final."
                    );

                    return;
                }


                if (desde) {

                    parametros.append(
                        "desde",
                        desde
                    );

                }


                if (hasta) {

                    parametros.append(
                        "hasta",
                        hasta
                    );

                }

                mapa.src =
                    "/mapa?"
                    + parametros.toString();

                actualizarEstadisticas(
                    parametros
                );

            }
        );


        async function actualizarEstadisticas(
            parametros
        ) {

            try {

                const respuesta = await fetch(
                    "/estadisticas?"
                    + parametros.toString()
                );

                const datos = await respuesta.json();

                document.getElementById(
                    "total-indicios"
                ).textContent = datos.total;

                document.getElementById(
                    "cantidad-robo"
                ).textContent = datos.robo;

                document.getElementById(
                    "cantidad-extorsion"
                ).textContent = datos.extorsion;

                document.getElementById(
                    "cantidad-agresion"
                ).textContent = datos.agresion;

                document.getElementById(
                    "cantidad-otro"
                ).textContent = datos.otro;

                document.getElementById(
                    "precision-alta"
                ).textContent = datos.precision_alta;

                document.getElementById(
                    "precision-media"
                ).textContent = datos.precision_media;

                document.getElementById(
                    "precision-baja"
                ).textContent = datos.precision_baja;

            } catch (error) {

                console.error(
                    "Error al obtener estadísticas:",
                    error
                );

            }

        }

        actualizarEstadisticas(
            new URLSearchParams()
        );

    </script>

</body>

</html>
